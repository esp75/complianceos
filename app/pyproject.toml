[project]
name = "celestia-api"
version = "0.2.0"
description = "ComplianceOS v0.2 FastAPI orchestration / BFF layer over theopenlane (L1 substrate)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "asyncpg>=0.30",  # L2 KG client -> kg-postgres (Postgres 17 + AGE + pgvector)
    # Trust layer (Phase 4, ADR-0016): Ed25519 signing + HKDF key derivation (pyca/cryptography,
    # EU-acceptable, offline) and pure-Python deterministic PDF rendering (fpdf2, no native deps).
    "cryptography>=43",
    "fpdf2>=2.8",
    # L3 SDER packages consumed by the /sder router (M7). Path deps — see [tool.uv.sources].
    "itu-compliance",
    "risk-scoring",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "hypothesis>=6.100",
]

[tool.uv]
package = true

# L3 packages live under layers/ (ADR-0009); the BFF imports them as editable path
# deps. The Docker image mounts the same relative layout so these resolve in-container
# (../layers from the app project root) — see app/Dockerfile.
[tool.uv.sources]
itu-compliance = { path = "../layers/L3-sder-engine/itu-compliance", editable = true }
risk-scoring = { path = "../layers/L3-sder-engine/risk-scoring", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fpdf.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
