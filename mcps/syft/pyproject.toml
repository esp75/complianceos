[project]
name = "celestia-mcp-syft"
version = "0.1.0"
description = "MCP server: Syft SBOM generator wrapped as MCP."
requires-python = ">=3.12"
dependencies = [
  "mcp[cli]>=1.0",
  "pydantic>=2.13",
]

[project.scripts]
syft-mcp = "syft_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
