[project]
name = "celestia-mcp-semgrep"
version = "0.1.0"
description = "MCP server: Semgrep CLI wrapped as MCP for /cso to call."
requires-python = ">=3.12"
dependencies = [
  "mcp[cli]>=1.0",
  "pydantic>=2.13",
]

[project.scripts]
semgrep-mcp = "semgrep_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
