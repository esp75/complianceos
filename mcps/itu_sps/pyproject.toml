[project]
name = "celestia-mcp-itu-sps"
version = "0.1.0"
description = "MCP server: ITU Space Network Systems (SNS / SpaceCap)."
requires-python = ">=3.12"
dependencies = [
  "mcp[cli]>=1.0",
  "httpx>=0.28",
  "pydantic>=2.13",
]

[project.scripts]
itu-sps-mcp = "itu_sps_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
