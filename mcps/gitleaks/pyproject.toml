[project]
name = "celestia-mcp-gitleaks"
version = "0.1.0"
description = "MCP server: gitleaks CLI wrapped as MCP for secrets scanning."
requires-python = ">=3.12"
dependencies = [
  "mcp[cli]>=1.0",
  "pydantic>=2.13",
]

[project.scripts]
gitleaks-mcp = "gitleaks_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
