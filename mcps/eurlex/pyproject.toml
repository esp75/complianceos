[project]
name = "celestia-mcp-eurlex"
version = "0.1.0"
description = "MCP server: EUR-Lex regulation watcher and search."
requires-python = ">=3.12"
dependencies = [
  "mcp[cli]>=1.0",
  "httpx>=0.28",
  "pydantic>=2.13",
]

[project.scripts]
eurlex-mcp = "eurlex_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
