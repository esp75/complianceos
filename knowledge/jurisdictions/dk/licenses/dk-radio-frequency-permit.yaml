id: dk-radio-frequency-permit
jurisdiction: dk
name: Radio frequency permit for a ground station (use of radio frequencies)
name_local: Tilladelse til anvendelse af radiofrekvenser
authority: dk-digst
category: spectrum
summary: Radio frequencies may be used only on the basis of a permit from the Danish Agency for Digitalisation (Digitaliseringsstyrelsen).
  The agency may set rules for use without a permit. Receive-only installations do not need a permit (§ 6(3)). Permit conditions,
  decision periods and fees were not researched.
applies_when:
  field: ground_station_countries
  contains: DK
  because: You plan a ground station in Denmark.
  cite:
  - dk.rf.s6-1
legal_basis:
- id: dk.rf.s6-1
  instrument: Lov om radiofrekvenser, LBK nr 119 af 21/01/2026
  provision: § 6, stk. 1
  url: https://www.retsinformation.dk/eli/lta/2026/119
  retrieved: '2026-11-03'
  language: da
  excerpt: Anvendelse af radiofrekvenser kan alene ske på grundlag af tilladelse udstedt af Digitaliseringsstyrelsen, jf.
    dog stk. 2-6.
  excerpt_en: Radio frequencies may be used only on the basis of a permit issued by the Danish Agency for Digitalisation (Digitaliseringsstyrelsen),
    subject to subsections 2 to 6. (Unofficial translation.)
