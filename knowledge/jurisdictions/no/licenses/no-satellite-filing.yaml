id: no-satellite-filing
jurisdiction: 'no'
name: Satellite system filing to the ITU register through Nkom
name_local: Innmelding av satellittsystemer til internasjonalt register
authority: no-nkom
category: itu_filing
summary: On application, the ministry may file a satellite system with the international register. Its powers under § 11-16
  (first and second subsections) are delegated to Nkom. The Act is discretionary (“may”), and the timing, the fee and the
  application requirements were not researched.
applies_when:
  field: filing_administration
  eq: 'NO'
  because: Norway is the administration filing your satellite network with the ITU.
