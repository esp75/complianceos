  instrument: Lov om elektronisk kommunikasjon (ekomloven), LOV-2024-12-13-76, chapter 11
  provision: § 11-16 first sentence
  url: https://lovdata.no/nav/lov/2024-12-13-76/kap11
  retrieved: '2026-11-03'
  language: 'no'
  excerpt: Departementet kan etter søknad gjennomføre innmelding av satellittsystemer til internasjonalt register.
  excerpt_en: The ministry may, on application, carry out the filing of satellite systems with the international register.
    (Unofficial translation.)
