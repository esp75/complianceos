summary: Frequencies may not be taken into use without a permit. Under the Electronic Communications Act the ministry grants
  the permit, and its powers under § 11-2 (first subsection) are delegated to the Nasjonal kommunikasjonsmyndighet (Nkom).
  Permit conditions, duration and fees were not researched.
