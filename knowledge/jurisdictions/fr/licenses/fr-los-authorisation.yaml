id: fr-los-authorisation
jurisdiction: fr
name: Space operation authorisation (LOS)
name_local: Autorisation au titre de la loi relative aux opérations spatiales
authority: fr-ministry-space
category: space_activity
summary: >
  Prior authorisation to launch, or to control in orbit, a space object or a group of coordinated
  space objects. The authority checks the operator's moral, financial and professional guarantees
  and, through CNES, the conformity of its systems with the technical regulations. A transfer of
  control needs its own authorisation.
applies_when:
  any:
    - field: launch_country
      eq: FR
      because: You plan to launch from French territory (any operator, whatever its nationality).
      cite: [fr.los.art-2]
    - field: operator_country
      eq: FR
      because: >
        As a French operator you need authorisation to procure a launch or to control your
        satellites in orbit, wherever the launch takes place.
      cite: [fr.los.art-2]
legal_basis:
  - id: fr.los.art-2
    instrument: Loi n° 2008-518 du 3 juin 2008 relative aux opérations spatiales
    provision: Article 2
    url: https://www.legifrance.gouv.fr/loda/id/LEGITEXT000018939303/
    retrieved: 2026-10-15
    language: fr
    excerpt: >
      Doit préalablement obtenir une autorisation délivrée par l'autorité administrative : 1° Tout
      opérateur, quelle que soit sa nationalité, qui entend procéder au lancement d'un objet spatial à
      partir du territoire national [...] ; 2° Tout opérateur français qui entend procéder au
      lancement d'un objet spatial à partir du territoire d'un Etat étranger [...] ; 3° Toute
      personne physique possédant la nationalité française ou personne morale ayant son siège en
      France, qu'elle soit ou non opérateur, qui entend faire procéder au lancement d'un objet spatial
      ou tout opérateur français qui entend assurer la maîtrise d'un tel objet ou d'un groupe d'objets
      spatiaux coordonnés pendant son séjour dans l'espace extra-atmosphérique.
    excerpt_en: >
      Prior authorisation from the administrative authority is required for: 1° any operator,
      whatever its nationality, intending to launch a space object from national territory [...];
      2° any French operator intending to launch a space object from the territory of a foreign
      State [...]; 3° any French national or legal person with its registered office in France,
      whether or not an operator, intending to have a space object launched, or any French operator
      intending to control such an object or a group of coordinated space objects while in outer
      space. (Unofficial translation.)
  - id: fr.los.art-4
    instrument: Loi n° 2008-518 du 3 juin 2008 relative aux opérations spatiales
    provision: Article 4, first paragraph
    url: https://www.legifrance.gouv.fr/loda/id/LEGITEXT000018939303/
    retrieved: 2026-10-15
    language: fr
    excerpt: >
      Les autorisations de lancement d'un objet spatial ou les opérations de maîtrise et de transfert
      de la maîtrise d'un tel objet ou d'un groupe d'objets spatiaux coordonnés lancés et de retour sur
      Terre sont délivrées après vérification, par l'autorité administrative, des garanties morales,
      financières et professionnelles du demandeur et, le cas échéant, de ses actionnaires, et de la
      conformité des systèmes et procédures qu'il entend mettre en œuvre avec la réglementation
      technique édictée [...].
    excerpt_en: >
      Authorisations to launch a space object, or to control or transfer control of such an object
      or of a group of coordinated space objects, are granted after the administrative authority has
      verified the applicant's moral, financial and professional guarantees and, where applicable,
      those of its shareholders, and the conformity of the systems and procedures it intends to use
      with the technical regulations [...]. (Unofficial translation.)
needed_by: launch
preparation:
  min_weeks: 8
  typical_weeks: 12
  max_weeks: 26
  basis: estimate
  note: >
    CNES offers pre-application discussions well before submission; use them to agree the schedule
    and open the FSOA platform account.
review:
  min_weeks: 22
  typical_weeks: 26
  max_weeks: 39
  basis: practice
  note: >
    CNES recommends submitting on the FSOA platform no later than 5 to 6 months before the launch
    date. Review starts once the ministry has registered the application as complete.
  source:
    title: CNES FSOA — Authorisation process
    url: https://spacecare.cnes.fr/en/the-fsoa-orbital-systems-office/authorisation-process/
    retrieved: 2026-10-15
documents:
  - Administrative part (moral, financial and professional guarantees of the operator)
  - Technical part (conformity with the LOS technical regulations)
  - Payload part
obligations:
  - id: fr-los-pre-launch-requirements
    name: Close out pre-launch requirements
    description: >
      The authorisation order sets pre-launch requirements; the launch can only take place once all
      of them are closed out with the CNES FSOA Office.
    anchor: launch
    kind: hard
requires_local_presence: false
local_presence_note: >
  The LOS applies to foreign operators launching from France and to French operators; it does not
  itself require a foreign operator to set up a French entity.
status: draft
last_verified: 2026-10-15
sources:
  - title: CNES FSOA — Authorisation process
    url: https://spacecare.cnes.fr/en/the-fsoa-orbital-systems-office/authorisation-process/
    retrieved: 2026-10-15
