id: fr-satellite-frequency-operating-authorisation
jurisdiction: fr
name: Authorisation to operate satellite frequency assignments
name_local: Autorisation d'exploitation d'assignations de fréquence à un système satellitaire
authority: fr-anfr
category: spectrum
summary: >
  Operating frequency assignments that France declared to the ITU needs an authorisation from the
  minister in charge of electronic communications. ANFR instructs the application, consults the
  frequency-assigning authorities and sends the file to the minister. The operator must show it can
  control all stations, including earth stations, that use the assignment.
applies_when:
  field: filing_administration
  eq: FR
  because: Your frequency assignments are declared to the ITU by France.
  cite: [fr.cpce.l97-2-i-2]
legal_basis:
  - id: fr.cpce.l97-2-i-2
    instrument: Code des postes et des communications électroniques
    provision: Article L97-2, I, 2
    url: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006465950
    retrieved: 2026-10-15
    language: fr
    excerpt: >
      L'exploitation d'une assignation de fréquence à un système satellitaire, déclarée par la France
      à l'Union internationale des télécommunications, est soumise à l'autorisation du ministre chargé
      des communications électroniques, après avis des autorités affectataires des fréquences
      radioélectriques concernées. L'octroi de l'autorisation est subordonné à la justification par le
      demandeur de sa capacité à contrôler l'émission de l'ensemble des stations radioélectriques, y
      compris les stations terriennes, utilisant l'assignation de fréquence [...].
    excerpt_en: >
      Operating a satellite-system frequency assignment declared by France to the ITU requires
      authorisation from the minister in charge of electronic communications, after consulting the
      authorities to which the frequencies are assigned. The authorisation requires the applicant to
      show it can control the emissions of all radio stations, including earth stations, using the
      assignment [...]. (Unofficial translation.)
  - id: fr.cpce.r52-3-6
    instrument: Code des postes et des communications électroniques
    provision: Article R52-3-6
    url: https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006070987/LEGISCTA000006136659/
    retrieved: 2026-10-15
    language: fr
    excerpt: >
      A l'issue de l'instruction, et au plus tard dans un délai de quatre mois à compter de la
      réception de la demande, l'Agence nationale des fréquences transmet au ministre chargé des
      communications électroniques un dossier [...]. Le ministre chargé des communications
      électroniques dispose d'un délai de deux mois à compter de la réception du dossier pour statuer.
      S'il ne s'est pas prononcé dans ce délai, sa décision est réputée négative.
    excerpt_en: >
      At the end of the review, and at the latest four months after receiving the application, ANFR
      sends the minister a file [...]. The minister has two months from receipt of the file to
      decide. Without a decision in that time, the application is deemed refused. (Unofficial
      translation.)
prerequisites:
  - license: fr-anfr-satellite-frequency-filing
    note: The authorisation covers assignments ANFR has already declared to the ITU.
needed_by: launch
preparation:
  min_weeks: 4
  typical_weeks: 8
  max_weeks: 12
  basis: estimate
  note: >
    The application file (content fixed by the arrêté of 11 August 2006) describes the company's
    organisation and how it controls the satellite's signals. ANFR's guide asks for it before the
    bringing-into-use declaration.
review:
  min_weeks: 8
  typical_weeks: 22
  max_weeks: 26
  basis: statutory
  note: Up to four months at ANFR, then two months for the minister; silence counts as refusal.
  cite: [fr.cpce.r52-3-6]
documents:
  - Application file per the arrêté of 11 August 2006 (company organisation, signal control methods)
  - Final frequency plan as carried on board
fees: >
  A processing fee is due (Art. L97-2, I, 2). ANFR's 2021 guide states a one-off payment of
  EUR 20,000 for the ministerial authorisation; check the current amount with ANFR.
obligations:
  - id: fr-l97-2-permanent-control
    name: Keep permanent control of emissions
    description: >
      The holder must permanently control the emissions of all stations using the assignment,
      including earth stations, and stop harmful interference on the minister's request.
    anchor: granted
    kind: soft
    cite: [fr.cpce.l97-2-i-2]
status: draft
last_verified: 2026-10-15
sources:
  - title: ANFR — Guide for start-ups and SMEs on access to space frequencies (v1.0)
    url: https://www.anfr.fr/fileadmin/medias/brochures-plaquettes/Guide-PME-frequences-spatiales.pdf
    retrieved: 2026-10-15
