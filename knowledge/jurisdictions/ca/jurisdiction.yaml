id: ca
name: Canada
kind: national
country: CA
summary: 'Covered: the radio authorisation for a ground station under the Radiocommunication Act, issued by the Minister responsible
  for ISED, and the space station spectrum licence with its ITU filing through ISED (CPC-2-6-02). Not covered: earth station
  spectrum licences under CPC-2-6-01 and CPC-2-6-03, foreign satellite approval, licence conditions, exemptions under regulations,
  and fee amounts.'
