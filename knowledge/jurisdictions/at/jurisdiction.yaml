id: at
name: Austria
kind: national
country: AT
summary: >-
  Space activities need the approval of the federal minister responsible for space, exercised by the Weltraumbehörde
  in the Federal Ministry for Innovation, Mobility and Infrastructure (BMIMI), under the Weltraumgesetz
  of 2011 and the Weltraumverordnung of 2015. Austria also keeps a national register of space objects.
  Only the space-activity approval is covered here: Austria's frequency and ITU filing route has not yet
  been researched.
authorities:
