# Local dev stack for complianceOS.
# Production deploy uses Coolify on Hetzner — this file is for local dev only.
#
# Bring up:    docker compose -f infra/docker-compose.yml up -d postgres
# Bring all:   docker compose -f infra/docker-compose.yml up -d
# Tear down:   docker compose -f infra/docker-compose.yml down

name: complianceos

services:
  postgres:
    # Postgres 17 + Apache AGE + pgvector. Built from infra/postgres/Dockerfile
    # because no upstream image bundles AGE and pgvector together.
    build:
      context: ./postgres
      dockerfile: Dockerfile
    image: complianceos/postgres-age-vector:pg17
    container_name: complianceos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: celestia
      POSTGRES_PASSWORD: celestia_dev_only
      POSTGRES_DB: celestia
    ports:
      # Host 5433 → container 5432. 5432 is left for other projects' Postgres.
      - "5433:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U celestia -d celestia"]
      interval: 5s
      timeout: 5s
      retries: 10

  zitadel:
    # Self-hosted OIDC provider (free, open source). Uses the same Postgres instance,
    # in its own database created by infra/postgres/init/02_zitadel_db.sql.
    # Version pinned to a known tag. Verify before first run.
    image: ghcr.io/zitadel/zitadel:v2.71.7
    container_name: complianceos-zitadel
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: start-from-init --masterkey "${ZITADEL_MASTERKEY:?set ZITADEL_MASTERKEY in infra/.env}" --tlsMode disabled
    environment:
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: 8080
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: celestia
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: celestia_dev_only
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: celestia
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: celestia_dev_only
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
    ports:
      - "8080:8080"
    profiles: ["full"]

  api:
    build:
      context: ../app/api
      dockerfile: Dockerfile
    container_name: complianceos-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://celestia:celestia_dev_only@postgres:5432/celestia
      # Set ZITADEL_AUDIENCE to the project/client id created in Zitadel's console.
      ZITADEL_ISSUER: http://localhost:8080
      ZITADEL_AUDIENCE: ${ZITADEL_AUDIENCE:-}
    ports:
      - "8000:8000"
    volumes:
      - ../app/api:/app:ro
    profiles: ["full"]

  web:
    build:
      context: ../app/web
      dockerfile: Dockerfile
    container_name: complianceos-web
    depends_on:
      - api
      - zitadel
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
    ports:
      - "3000:3000"
    volumes:
      - ../app/web:/app
      - /app/node_modules
    profiles: ["full"]

