# ITU RR Article 22 — Protection of space services (EPFD limits for non-GSO)
# Source: ITU Radio Regulations (2020) — DRAFT (paraphrased; review against official text)

apiVersion: openlane.io/v1
kind: Control
metadata:
  name: itu-rr-art-22
  framework: itu
  citation: "ITU RR Art.22"
  display_name: "Protection of GSO from non-GSO systems (EPFD limits)"
  validation_status: draft

spec:
  description: |
    Non-geostationary (non-GSO) satellite systems shall not cause unacceptable
    interference to, and shall not claim protection from, geostationary (GSO)
    networks operating in accordance with the Radio Regulations. Non-GSO systems
    shall observe the equivalent power-flux-density (EPFD) limits specified in
    Article 22 and validated by the relevant Bureau software.

  rase:
    requirement: |
      A non-GSO operator SHALL ensure its system complies with the Article 22
      EPFD(down/up/is) limits protecting GSO networks, validated by the applicable
      ITU examination.
    applicability: |
      Non-GSO FSS/BSS systems operating in frequency bands where EPFD limits apply.
    selection: |
      EPFD limit set depends on band and antenna size; validated via ITU EPFD
      examination software prior to recording.
    exception: |
      GSO networks, and non-GSO systems in bands without EPFD limits, are out of
      scope of the Art.22 EPFD constraints.

  deontic_modality: SHALL

  controls:
    - id: itu-rr-art-22-epfd-compliance
      description: "Non-GSO operator must demonstrate EPFD compliance via the ITU examination before bringing into use."
      severity: critical
      evidence_required:
        - itu-snl-filing
      assessment_frequency: per-filing
      verification_method: itu-epfd-examination-favourable-finding
      breach_consequence: "Assignment cannot be recorded; non-GSO system must not cause interference to GSO."

  cross_references:
    - "ITU RR Art.11"
    - "ITU RR Art.21"

  entity_links:
    - entity: Operator
      relation: subject_to
    - entity: FrequencyAssignment
      relation: applies_to
