# ITU RR Article 21 — Terrestrial and space services sharing frequency bands above 1 GHz
# Source: ITU Radio Regulations (2020) — DRAFT (paraphrased; review against official text)

apiVersion: openlane.io/v1
kind: Control
metadata:
  name: itu-rr-art-21
  framework: itu
  citation: "ITU RR Art.21"
  display_name: "Power limits for shared bands above 1 GHz"
  validation_status: draft

spec:
  description: |
    In frequency bands above 1 GHz shared between space and terrestrial services,
    transmissions shall observe the power-flux-density (pfd) limits at the Earth's
    surface and the e.i.r.p. and power limits specified in Article 21, to protect
    co-frequency terrestrial services from harmful interference.

  rase:
    requirement: |
      The operator SHALL ensure space-station emissions do not exceed the pfd
      limits at the Earth's surface and the associated power/e.i.r.p. limits for
      the relevant shared band.
    applicability: |
      Space stations transmitting in bands above 1 GHz shared with terrestrial
      services (per the Table of Frequency Allocations).
    selection: |
      Applicable pfd masks depend on band and angle of arrival; the operator
      demonstrates compliance via link budget and emission analysis.
    exception: |
      Bands allocated exclusively to space services, or below the applicability
      threshold, are out of scope of the Art.21 pfd limits.

  deontic_modality: SHALL

  controls:
    - id: itu-rr-art-21-pfd-compliance
      description: "Operator must demonstrate emissions comply with Article 21 pfd / power limits for shared bands."
      severity: high
      evidence_required:
        - itu-snl-filing
      assessment_frequency: per-filing
      verification_method: pfd-mask-compliance-analysis

  cross_references:
    - "ITU RR Art.22"

  entity_links:
    - entity: Operator
      relation: subject_to
    - entity: FrequencyAssignment
      relation: applies_to
