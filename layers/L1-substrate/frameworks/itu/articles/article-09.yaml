# ITU RR Article 9 — Coordination of frequency assignments
# Source: ITU Radio Regulations (2020) — DRAFT (paraphrased; review against official text)

apiVersion: openlane.io/v1
kind: Control
metadata:
  name: itu-rr-art-09
  framework: itu
  citation: "ITU RR Art.9"
  display_name: "Coordination with other administrations"
  validation_status: draft

spec:
  description: |
    Before notifying frequency assignments to a satellite network, an
    administration shall effect advance publication and, where required, seek
    coordination with other administrations whose services may be affected, in
    order to avoid harmful interference between satellite networks.

  rase:
    requirement: |
      The notifying administration (on behalf of the operator) SHALL complete
      advance publication and the applicable coordination procedure with affected
      administrations before bringing the assignment into use.
    applicability: |
      All satellite networks requiring coordination under the Table of Frequency
      Allocations and the coordination arcs/thresholds in Appendices 5/30/30A/30B.
    selection: |
      Coordination triggers depend on band, orbit (GSO vs non-GSO), and the
      coordination thresholds; the operator identifies affected networks.
    exception: |
      Assignments below the coordination threshold or in bands not subject to
      coordination may proceed directly to notification (Art.11).

  deontic_modality: SHALL

  controls:
    - id: itu-rr-art-09-coordination-complete
      description: "Operator/administration must complete advance publication and coordination before bringing assignments into use."
      severity: high
      evidence_required:
        - itu-snl-filing
      assessment_frequency: per-filing
      verification_method: itu-bric-coordination-record

  cross_references:
    - "ITU RR Art.11"
    - "EU-SA Art.3"

  entity_links:
    - entity: Operator
      relation: subject_to
    - entity: FrequencyAssignment
      relation: applies_to
