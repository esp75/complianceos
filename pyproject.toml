[project]
name = "complianceos"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "cryptography>=48.0.0",
    "fastapi[all]>=0.136.1",
    "hapsira>=0.18.0",
    "httpx>=0.28.1",
    "lightrag-hku>=1.4.16",
    "mcp[cli]>=1.27.1",
    "pgvector>=0.4.2",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-yaml>=1.6.0",
    "pyhanko>=0.35.1",
    "pyjwt[crypto]>=2.10.0",
    "sgp4>=2.25",
    "skyfield>=1.54",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.47.0",
    "weasyprint>=68.1",
]

[dependency-groups]
dev = [
    "hypothesis>=6.152.7",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "respx>=0.23.1",
    "ruff>=0.15.13",
    "semgrep>=1.85.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
testpaths = ["app", "mcps", "tests"]
pythonpath = [".", "mcps/eurlex"]
# `vendor` MUST stay excluded. vendor/skyfield/contrib/almanac2/test_almanac2.py
# calls `load('de430t.bsp')` at module import time, which writes a 128 MB JPL
# ephemeris file to cwd. Unbounded collection there filled the disk once already.
norecursedirs = ["vendor", ".venv", "node_modules", "data", "infra/coolify/.state"]
asyncio_mode = "auto"

[tool.ruff]
extend-exclude = ["vendor", ".venv", "node_modules", "data"]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = [".", "mcps/eurlex"]
exclude = ["vendor/", ".venv/", "node_modules/", "data/"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true
