name: Citation links

# Laws move. Once a week, check that every official URL in the knowledge pack still answers.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - working-directory: app
        run: uv sync --frozen
      - name: Check cited URLs
        working-directory: app
        run: uv run python ../scripts/check-knowledge-links.py
      - name: Check quoted excerpts are still on the cited pages
        # Fails only when a page shows the law but the quote no longer matches (likely an amendment).
        # Pages that refuse automated readers are reported as blocked or unreadable, not failures.
        if: always()
        working-directory: app
        run: uv run python -m app.planner.pack_qa --json ../pack-qa.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pack-qa
          path: pack-qa.json
          if-no-files-found: ignore
