name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check app/api tests
      - name: mypy (strict, explicit files: directory args clash on app/api/reggraph)
        run: uv run mypy --strict app/api/main.py app/api/auth.py app/api/reggraph/models.py app/api/reggraph/loader.py app/api/reggraph/__init__.py tests/api/test_main.py tests/reggraph/test_loader.py
      - run: uv run pytest tests -q
