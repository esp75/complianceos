# EU Space Act: obligations drawn from the Commission proposal COM(2025) 335, CELEX 52025PC0335.
#
# STATUS: PROPOSAL ONLY. Not adopted. Not in force. Not enforced.
# Every entry carries the tag "proposal-not-adopted". Article numbers and wording may change
# before adoption. Do not present these as current law.
